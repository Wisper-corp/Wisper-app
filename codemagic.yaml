# Builds the iOS app and sends it to TestFlight.
#
# There is no Mac here: the machine this repo is developed on has no Xcode and
# not enough disk to install it, so the iOS build runs on Codemagic's macOS
# instances instead. The output is an ordinary signed .ipa -- same toolchain,
# same signing, same App Store Connect -- so testers see no difference.
#
# Signing uses an App Store Connect API key held in Codemagic under the
# integration named below. The key never appears in this file or in the repo.

workflows:
  ios-testflight:
    name: iOS · TestFlight
    instance_type: mac_mini_m2
    # The first build compiles every pod from source -- Agora, SmileID,
    # Monnify and Firebase are all heavy -- so it needs more than the default.
    max_build_duration: 120

    environment:
      # No `integrations:` block. Looking the key up by name failed repeatedly:
      # the integration exists and is connected, but the build could not
      # resolve it, and a name that has to match a string typed into a web form
      # is a poor thing to depend on. The credentials come from a variable
      # group instead, which the App Store Connect CLI reads by name.
      groups:
        - appstore_credentials
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.wispermedia.app
      vars:
        BUNDLE_ID: com.wispermedia.app

    scripts:
      - name: Use CocoaPods, not Swift Package Manager
        # Recent Flutter turns SPM on by default and will migrate the Xcode
        # project to it on first build. This project has always been assembled
        # by CocoaPods and most of its plugins have no SPM support anyway, so
        # the migration buys nothing and changes the one part of the build
        # that cannot be tested from here. (It is not what caused the
        # duplicate Lottie.framework -- see ios/Podfile for that.)
        script: flutter config --no-enable-swift-package-manager

      - name: Fetch packages
        script: flutter pub get

      - name: Run the test suite
        # A broken commit should never reach a tester. These are the same tests
        # that run before every Android release.
        script: flutter test

      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Apply the signing profile to the Xcode project
        # This is what writes /Users/builder/export_options.plist, which the
        # build below exports with. Without it the profile is uploaded but
        # never applied, and the export step has no options file to read.
        script: xcode-project use-profiles

      - name: Work out the build number
        # TestFlight refuses a build number it has seen before, and the last
        # iOS build predates this pipeline, so the number is taken from what
        # App Store Connect already holds rather than from pubspec.yaml. If the
        # lookup fails -- no builds yet, or a first run -- it falls back to
        # Codemagic's own counter, which only ever goes up.
        script: |
          set -e
          LATEST=$(app-store-connect get-latest-testflight-build-number \
            --bundle-id "$BUNDLE_ID" 2>/dev/null || echo "")
          if [ -z "$LATEST" ]; then
            echo "No TestFlight build found; using Codemagic's counter."
            NEXT="$PROJECT_BUILD_NUMBER"
          else
            echo "Latest build on TestFlight: $LATEST"
            NEXT=$((LATEST + 1))
          fi
          echo "Building as build number $NEXT"
          echo "BUILD_NUMBER=$NEXT" >> "$CM_ENV"

      - name: Build the ipa
        script: |
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Check Lottie exports the symbols SmileIDSDK links against
        # Build 15 was rejected under 2.1(a): dyld killed it at launch with
        # "Symbol not found: enum case for
        # Lottie.LottiePlaybackMode.PlaybackMode.fromProgress", referenced by
        # SmileIDSDK and expected in Lottie. SmileIDSDK is a binary framework
        # built against a Lottie with library evolution; the lottie-ios pod is
        # built from source and omits those resilient symbols unless
        # BUILD_LIBRARY_FOR_DISTRIBUTION is on (set in ios/Podfile).
        #
        # Nothing about that failure is visible until the app is launched on a
        # device, so it is checked here instead of discovered by App Review.
        script: |
          set -e
          APP=$(find "$CM_BUILD_DIR/build/ios" -name "Runner.app" -path "*Applications*" | head -1)
          [ -n "$APP" ] || APP=$(find "$CM_BUILD_DIR/build/ios" -maxdepth 3 -name "Runner.app" | head -1)
          echo "Checking $APP"

          LOTTIE="$APP/Frameworks/Lottie.framework/Lottie"
          SMILE="$APP/Frameworks/SmileIDSDK.framework/SmileIDSDK"
          [ -f "$LOTTIE" ] || { echo "No Lottie.framework in the app bundle."; exit 1; }

          # Every Lottie symbol SmileIDSDK leaves undefined must be exported by
          # Lottie. Comparing the whole set beats grepping for the one symbol
          # that happened to break last time.
          if [ -f "$SMILE" ]; then
            nm -u "$SMILE" 2>/dev/null | grep '6Lottie' | sed 's/^ *//' | sort -u > /tmp/needed.txt
            nm -gU "$LOTTIE" 2>/dev/null | awk '{print $NF}' | sort -u > /tmp/exported.txt
            MISSING=$(comm -23 /tmp/needed.txt /tmp/exported.txt || true)
            if [ -n "$MISSING" ]; then
              echo "Lottie is missing symbols SmileIDSDK links against:"
              echo "$MISSING" | head -20
              echo "This is the dyld crash that got build 15 rejected. Not shipping it."
              exit 1
            fi
            echo "All $(wc -l < /tmp/needed.txt) Lottie symbols SmileIDSDK needs are exported."
          else
            echo "SmileIDSDK.framework not found; skipping the cross-check."
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      # Kept because the first build after a long gap usually fails in the
      # native step, and the Xcode log is the only place that says why.
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        # Read from the appstore_credentials group above.
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Tester extra
        # Not submitted for App Store review from here -- this pipeline is for
        # testers. A release build is promoted from App Store Connect.
        submit_to_app_store: false

      email:
        recipients:
          - farazali7530@gmail.com
        notify:
          success: true
          failure: true
